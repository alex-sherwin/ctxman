# yaml-language-server: $schema=http://127.0.0.1:4321/api/schemas/snippet
name: conventional-commits
description: The commit message rules every agent that commits gets told, in Conventional Commits form.
tags:
  - git
markdown: |
  Write every commit message as a [Conventional Commit](https://www.conventionalcommits.org/):

  - `type(scope): summary`, where type is one of `feat`, `fix`, `refactor`, `docs`, `test` or `chore`
  - the summary in the imperative mood, lower case, with no trailing full stop
  - a body that explains why, wrapped at 72 columns

  Commit only when asked, and never push.
